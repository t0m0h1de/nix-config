name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
      - run: nix run --inputs-from . nixpkgs#nixpkgs-fmt -- --check .

  # Home Manager の全プロファイルをビルドする(switch はしない)。
  # overlay の自前パッケージもここで実際にビルドされるので、bump PR の hash 誤りやビルド失敗を検出できる。
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            profiles: linux
          # darwin と work は同じ aarch64-darwin で差分が小さいので、1 ランナーでまとめてビルドする。
          - os: darwin
            runner: macos-latest
            profiles: darwin work
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # ubuntu ランナーは空きディスクが少なく、クロージャ全体を置くと溢れることがあるため、
      # 使わないツールチェーンを消して場所を空ける。
      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}

      - name: Build home configurations
        run: |
          targets=()
          for profile in ${{ matrix.profiles }}; do
            targets+=(".#homeConfigurations.${profile}.activationPackage")
          done
          nix build --no-link --print-build-logs "${targets[@]}"
